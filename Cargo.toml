[package]
name = "research-dashboard"
version = "0.4.4"
edition = "2024"
default-run = "research-dashboard"
description = "Scopework: a local research workbench for people and agents"
license = "MIT"
repository = "https://github.com/isekaishy-jpg/ScopeWork"
readme = "README.md"

[dependencies]
regex = "1"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
toml = "0.9"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
