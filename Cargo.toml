[package]
name = "research-dashboard"
version = "0.8.0"
rust-version = "1.98"
edition = "2024"
default-run = "research-dashboard"
description = "Scopework: a local research workbench for people and agents"
license = "MIT"
repository = "https://github.com/isekaishy-jpg/ScopeWork"
readme = "README.md"

[dependencies]
solworker = { git = "https://github.com/isekaishy-jpg/solworker.git", rev = "273b45b04f8c30d5fcc6c017bdaad4eab9ff8cde" }
solcache = { git = "https://github.com/isekaishy-jpg/solcache.git", rev = "63105fecf152f4ad4e74c90fbeef24572726e0dc" }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
toml = "0.9"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
