name: Feature request
description: Propose one focused improvement to the research workflow.
title: "[Feature] "
body:
  - type: textarea
    id: task
    attributes:
      label: What task are you trying to complete?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should Scopework do differently?
      description: Describe one concrete change and how it would help.
    validations:
      required: true
