name: Windows build

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', LICENSE]
  pull_request:
    paths-ignore: ['**/*.md', LICENSE]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Select Rust toolchain
        run: rustup override set 1.98.0
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Regression tests
        run: cargo test --locked --all-targets
      - name: Lint without warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build Windows installer
        # CI never reserves build numbers; it builds the committed one.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/build.ps1 -UseCommittedNumber
      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Scopework-windows-x64
          path: |
            dist/*.msi
            dist/*.sha256
          if-no-files-found: error
